name: Keep Render service awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render free tier's 15-minute
    # idle-sleep threshold, with buffer for GitHub's scheduling jitter.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping service
        run: curl -fsS --max-time 30 https://smartbiz-service.onrender.com/
